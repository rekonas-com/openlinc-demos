[project]
name = "openlinc"
version = "0.1.1"
description = "PC bridge for live Somnolinc Headband data streamed from the phone app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "psutil>=7.2.2",
    "python-osc>=1.10.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "segno>=1.6.6",
    "typer>=0.28.0",
]

[project.scripts]
bridge = "openlinc.bridge.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "openlinc"
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[dependency-groups]
